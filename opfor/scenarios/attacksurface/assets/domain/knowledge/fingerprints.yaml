# Product fingerprints, a deterministic identification layer the CVE scan's identify seam
# tries before the model.
#
# The contract, so a stale or thin table degrades to "identify less", never "identify wrong":
#
# - markers are high-signal substrings, a unique header name, a product tagline, or a product
#   name in the title. A host matches a product when ANY marker is present in its evidence
#   text, so each marker must be specific enough that its presence alone is near-proof. A
#   generic word that another product could emit does not belong here.
# - version is an optional regex with one capture group, anchored near the product so it does
#   not lift an unrelated number. The capture is used only when it looks like a version,
#   major.minor at least, so a pattern that goes stale yields no version rather than garbage.
#   Give a version rule only when the product publishes its version plainly, a version header
#   or a version field, never a guess. Omit it otherwise, a product-only identification still
#   narrows the vulnerability lookup.
# - cpe is the NVD vendor:product string the lookup queries.
#
# The table is curated, not exhaustive. A product it misses falls to the model, and a product
# neither knows is a clean "unknown". Add a product by adding one block here, no code changes.
# First match wins, so a more specific product goes above a more general one.

products:
  - product: Jenkins
    cpe: jenkins:jenkins
    markers: ["x-jenkins:"]
    version: 'x-jenkins:\s*([0-9]+\.[0-9]+(?:\.[0-9]+)?)'

  - product: Kibana
    cpe: elastic:kibana
    markers: ["kbn-version:", "kbn-name:"]
    version: 'kbn-version:\s*([0-9]+\.[0-9]+\.[0-9]+)'

  - product: Elasticsearch
    cpe: elastic:elasticsearch
    markers: ["you know, for search", "lucene_version"]
    version: '"number"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)"'

  - product: Grafana
    cpe: grafana:grafana
    # not the bare word "grafana", which a page merely mentioning it would carry, but strings
    # only a Grafana instance emits: its app root element and its boot-data script global
    markers: ['grafana-app', 'grafanabootdata']
    version: 'grafanabootdata.{0,200}?"version"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)"'

  - product: GitLab
    cpe: gitlab:gitlab
    # the gon JS global GitLab sets, not the bare word "gitlab"
    markers: ['gon.gitlab']

  - product: Apache Airflow
    cpe: apache:airflow
    # the two-word product string, unlikely in incidental text, not the airflow word alone
    markers: ['apache airflow']

  - product: RabbitMQ
    cpe: pivotal_software:rabbitmq
    markers: ["rabbitmq management"]

  - product: Prometheus
    cpe: prometheus:prometheus
    markers: ["prometheus time series collection"]

  - product: SonarQube
    cpe: sonarsource:sonarqube
    markers: ["sonarqube"]

  - product: Argo CD
    cpe: argoproj:argo_cd
    markers: ["argocd", "argo-cd"]

  - product: HashiCorp Consul
    cpe: hashicorp:consul
    markers: ["/v1/agent/self"]
