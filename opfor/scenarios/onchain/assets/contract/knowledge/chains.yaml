# Chain policy, the surface-shaping reference data the sweep, pivot, funds read, and target filter
# read. It is data, loaded at build time, so widening a chain's value-token set or adding a chain is
# a data change here, not a code change, invariant 1.
#
# value_tokens are the assets counted toward funds at risk, one entry per token with its own
# decimals since a stable is 6 decimals on Ethereum but 18 elsewhere. kind drives pricing, `native`
# prices at the native-coin price, `stable` at one dollar, `priced` at the token's own DEX price. The
# native coin itself is 18 decimals, so native_decimals is shared across chains.
# null_addresses are the burn and mint sinks, never a contract, where a chain's burned supply piles
# up and a naive balance read would price it as funds, so they are skipped at the sweep and by
# triage. dex_layer_roles are the raw pool and plain token, not an audit target on their own, the
# pivot's job is to reach the fund contract behind them.
native_decimals: 18
null_addresses:
  - "0x0000000000000000000000000000000000000000"
  - "0x000000000000000000000000000000000000dead"
dex_layer_roles:
  - pool
  - token
#
# chain_id is the numeric id the explorer keys every chain on behind one key. gecko_network is the
# GeckoTerminal network slug the discovery sweep reads pools from. Both live here so adding a chain
# is one data edit, its id, its slug, and its value tokens, not three edits scattered across the
# source adapters.
chains:
  ethereum:
    chain_id: 1
    gecko_network: eth
    value_tokens:
