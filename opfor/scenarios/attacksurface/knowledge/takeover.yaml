# Subdomain takeover clues, fed to the triage model, never a verdict on their own. A
# service plus the unclaimed-resource text it serves when a name still points at it but the
# underlying resource is released. Triage matches a signature, lowercased, against the
# lowercased body head of a live host and, on a match, adds a clue to that host in the
# surface the model judges, for example "clue: matched GitHub Pages unclaimed-resource
# page". Whether it is a real takeover stays the model's call, judged against
# knowledge/classes/subdomain-takeover.md. This is public knowledge, mirrored from the
# can-i-take-over-xyz catalogue. Adding a service is a data change here.

services:
  - service: GitHub Pages
    signature: "there isn't a github pages site here"
  - service: Amazon S3
    signature: "nosuchbucket"
  - service: Heroku
    signature: "no such app"
  - service: Fastly
    signature: "fastly error: unknown domain"
  - service: Surge.sh
    signature: "project not found"
  - service: Bitbucket
    signature: "repository not found"
  - service: Read the Docs
    signature: "unknown to read the docs"
  - service: Ghost
    signature: "the thing you were looking for is no longer here"
  - service: Pantheon
    signature: "the gods are wise, but do not know of the site which you seek"
  - service: WP Engine
    signature: "the site you were looking for couldn't be found"
  - service: Tumblr
    signature: "whatever you were looking for doesn't currently exist at this address"
  - service: Shopify
    signature: "sorry, this shop is currently unavailable"
  - service: Netlify
    signature: "not found - request id"
