# Owner-power signatures. These are a user's trust risk, not an external attacker's hole, so they
# are kept in their own category and never raise the audit priority. Triage records them as a note
# on a finding, per the centralization-risk knowledge class.

signatures:
  - flag: owner_can_pause
    category: centralization
    pattern: "whenNotPaused|_pause\\(|function pause"
  - flag: owner_can_set_fee
    category: centralization
    pattern: "setFee|setTax|updateFee|setFees"
  - flag: owner_can_blacklist
    category: centralization
    pattern: "blacklist|setBlacklist|_isBlacklisted|isBot"
  - flag: owner_can_set_limits
    category: centralization
    pattern: "setMaxTx|maxTxAmount|setMaxWallet|setLimits"
