# Apache-project instances at pinned versions, for capturing fingerprint backtest cassettes.
#
# Airflow standalone runs the webserver against a local SQLite metadata DB in one container, enough
# to serve the unauthenticated sign-in page a scan sees. Run on a machine with Docker, not in CI:
#
#   docker compose -f evals/capture/apache/docker-compose.yml up -d
#   python -m evals.capture.record --product "Apache Airflow" --slug airflow --version 2.9.3 --url http://localhost:8181
#   docker compose -f evals/capture/apache/docker-compose.yml down -v
#
# Each capture probes the instance exactly as opfor would and writes evals/corpus/<slug>/<version>.json.

services:
  airflow-2-9:
    image: apache/airflow:2.9.3
    command: standalone
    environment:
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports: ["8181:8080"]
