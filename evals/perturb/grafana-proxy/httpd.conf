ServerName localhost
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
# Keep an encoded slash encoded, so a ..%2f traversal passes through to the app un-decoded, while a
# bare ../ is canonicalized and collapsed by the proxy, the realistic proxy that a recipe written
# with ../ no longer reproduces through, but an encoded variant does.
AllowEncodedSlashes NoDecode
ProxyPass "/" "http://grafana:3000/"
ProxyPassReverse "/" "http://grafana:3000/"
