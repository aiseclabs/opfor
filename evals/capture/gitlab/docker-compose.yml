# GitLab CE instances at pinned versions, for capturing fingerprint backtest cassettes.
#
# GitLab is a large image and boots in minutes, wait for the sign-in page to answer 200 before
# capturing. Run on a machine with Docker, not in CI:
#
#   docker compose -f evals/capture/gitlab/docker-compose.yml up -d
#   python -m evals.capture.record --product GitLab --version 16.11.10 --url http://localhost:8929
#   docker compose -f evals/capture/gitlab/docker-compose.yml down -v
#
# Each capture probes the instance exactly as opfor would and writes evals/corpus/gitlab/<version>.json.

services:
  gitlab-16-11:
    image: gitlab/gitlab-ce:16.11.10-ce.0
    shm_size: "256m"
    ports: ["8929:80"]
