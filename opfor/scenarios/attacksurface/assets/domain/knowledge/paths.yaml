# Interface paths to probe on a live host, to enumerate the reachable surface. Each is
# a plain GET, no payload, so probing is recon, not an attack. The list is high signal
# on purpose, config and version-control leaks, API specs, admin and monitoring
# interfaces, and product identity and version endpoints, so a wide run stays small and
# respectful. A product identity path answers with the product and often its exact
# version, which is what a later step matches against known vulnerabilities. The planner
# reads this and hands it to the endpoint capability, no capability reads the file.
# Adding a path is a data change here.

paths:
  - "/robots.txt"
  - "/sitemap.xml"
  - "/.well-known/security.txt"
  - "/.git/config"
  - "/.git/HEAD"
  - "/.env"
  - "/.svn/entries"
  - "/.DS_Store"
  - "/config.json"
  - "/config.php"
  - "/phpinfo.php"
  - "/server-status"
  - "/server-info"
  - "/actuator"
  - "/actuator/health"
  - "/actuator/env"
  - "/actuator/info"
  - "/metrics"
  - "/version"
  - "/api/version"
  - "/.well-known/openid-configuration"
  - "/nacos/"
  - "/v1/agent/self"
  - "/wp-json/"
  - "/manager/html"
  - "/debug/pprof/"
  - "/_cluster/health"
  - "/swagger.json"
  - "/swagger-ui.html"
  - "/openapi.json"
  - "/api-docs"
  - "/v2/api-docs"
  - "/graphql"
  - "/api"
  - "/admin"
  - "/login"
  - "/login/"
  - "/backup.zip"
  - "/backup.tar.gz"
  - "/.aws/credentials"
  - "/wp-login.php"
  # secret and configuration files that carry credentials or connection strings directly
  - "/.npmrc"
  - "/.git-credentials"
  - "/.ssh/id_rsa"
  - "/.htpasswd"
  - "/wp-config.php.bak"
  - "/appsettings.json"
  - "/web.config"
  - "/application.properties"
  - "/credentials.json"
  - "/config.yaml"
  # version-control metadata beyond the config, enough to reconstruct the tree
  - "/.git/index"
  - "/.git/logs/HEAD"
  - "/.hg/requires"
  # debug, routing, and management surfaces that leak internals
  - "/actuator/mappings"
  - "/console"
  - "/rails/info/routes"
  # database dumps and archive backups left in the web root
  - "/backup.sql"
  - "/dump.sql"
  - "/database.sql"
  - "/db.sql"
  - "/www.zip"
  # further API specification locations
  - "/v3/api-docs"
  - "/swagger/v1/swagger.json"
