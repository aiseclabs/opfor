# Mechanical probe configuration, read by the planner and handed to the endpoint probe.
# This holds no judgment. It decides only what the probe does not bother to fetch or
# treat as an interface, so the noise never reaches the surface the model judges.
#
#   static_assets   a file a web app serves, not an interface, so it is neither probed nor
#                   carried into the surface. A single-page app links dozens of hashed
#                   bundles, and each would otherwise bury the real routes. Matched by url
#                   suffix or by path prefix.
#
# Whether a reachable interface is public-by-design, protected, or a real exposure is a
# judgment, and that now lives in knowledge/classes/*.md where the model reads it. The old
# expected_public and protected keyword tables are gone. Adding a static-asset marker is a
# data change here.

static_assets:
  suffixes:
    - .js
    - .mjs
    - .css
    - .map
    - .ico
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .svg
    - .webp
    - .avif
    - .woff
    - .woff2
    - .ttf
    - .eot
    - .otf
    - .mp4
    - .webm
  prefixes:
    - /_next/static/
    - /static/
    - /assets/
    - /_nuxt/
