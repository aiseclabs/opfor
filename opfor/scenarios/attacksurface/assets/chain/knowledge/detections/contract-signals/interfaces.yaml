# The interface vocabulary the enum_interfaces capability applies mechanically. A function whose
# name is a fund path is tagged, and a function the source gates behind a guard keyword is marked
# guarded. This is detection data, not judgment. Whether an unguarded fund path makes a contract
# worth auditing is the triage's call.

fund_paths:
  - deposit
  - withdraw
  - redeem
  - claim
  - stake
  - unstake
  - swap
  - zap
  - mint
  - burn
  - liquidate
  - borrow
  - repay
  - harvest
  - compound
  - collect
  - execute
  - multicall

guards:
  - onlyOwner
  - onlyAdmin
  - onlyRole
  - onlyKeeper
  - onlyOperator
  - onlyGovernance
  - onlyManager
  - authorized
