name: Publish to PyPI

# Publishes on GitHub Release. Uses PyPI Trusted Publishing via OIDC, so no API
# token is stored anywhere, PyPI verifies this repository and environment instead.
# The build job verifies the artifact before publish runs, so a release cannot ship
# failing tests, broken metadata, or a wheel missing its bundled knowledge.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade build twine
      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build wheel and sdist
        run: |
          rm -rf dist/ build/
          python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/opfor --version
          /tmp/smoke/bin/python -m opfor --version
          /tmp/smoke/bin/opfor scenarios
          /tmp/smoke/bin/python -c "from pathlib import Path; import opfor.scenarios.attacksurface.assets.domain as d; k = Path(d.__file__).parent / 'knowledge'; assert len(list(k.rglob('*.md'))) >= 7; assert len(list(k.rglob('*.yaml'))) >= 4"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
