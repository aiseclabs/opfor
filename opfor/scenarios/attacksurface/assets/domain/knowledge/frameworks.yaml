# Front-end framework fingerprints, a context tag on a host line, not a finding and not a CVE
# input. It answers what a subdomain is, a bespoke web application built on a given framework,
# so the judge reads its role rather than treating the host as a nameless page. Detection is
# deterministic from the HTTP response the recon probe already gathered, body markers and
# marker headers, never a browser.
#
# The contract mirrors the product table:
#
# - body and headers are high-signal lowercased substrings. A host matches a framework when
#   ANY marker is present, so each must be specific to that framework, a marker string the
#   framework itself emits, not a word another site could carry. A framework whose only tell
#   is a generic word does not belong here, an honest miss beats a wrong tag.
# - headers markers match against the response headers as `name: value` text, so a marker such
#   as `x-powered-by: next.js` matches the header the framework sets.
# - version is an optional regex with one capture group, given only where the framework
#   publishes its version plainly, such as Angular's ng-version attribute, never guessed from a
#   build id or a chunk hash. Omit it otherwise, the framework name alone is the useful tag.
#
# The table is not a CVE input. A framework version is context for the judge, not a lookup key,
# so a React or a Vue version does not flood the vulnerability lookup with noise. Add a
# framework by adding one block, no code change.

frameworks:
  Next.js:
    body: ['id="__next"', "/_next/static/", "__next_data__"]
    headers: ["x-powered-by: next.js"]

  Angular:
    body: ["ng-version=", "_nghost-", "_ngcontent-"]
    headers: []
    version: 'ng-version="([0-9]+\.[0-9]+\.[0-9]+)"'
