# Interface paths to probe on a live host, to enumerate the reachable surface. Each is a plain
# GET, no payload, so probing is recon, not an attack. This is the remainder that no other owner
# holds yet, config and version-control leaks, management and debug surfaces, and a few generic
# probes. Paths that belong to an owner live with it, not here: a service's own identification and
# version endpoints in its fingerprints unit, the spec-discovery locations in ExpandSpec, the
# GraphQL endpoint in the introspector, and the robots and sitemap in the harvester. The planner
# reads this and hands it to the endpoint capability, no capability reads the file.

paths:
  - "/.well-known/security.txt"
  - "/.git/config"
  - "/.git/HEAD"
  - "/.env"
  - "/.svn/entries"
  - "/.DS_Store"
  - "/config.json"
  - "/config.php"
  - "/phpinfo.php"
  - "/server-status"
  - "/server-info"
  - "/actuator"
  - "/actuator/health"
  - "/actuator/env"
  - "/actuator/info"
  - "/metrics"
  - "/version"
  - "/api/version"
  - "/.well-known/openid-configuration"
  - "/nacos/"
  - "/v1/agent/self"
  - "/wp-json/"
  - "/manager/html"
  - "/debug/pprof/"
  - "/_cluster/health"
  - "/api"
  - "/admin"
  - "/backup.zip"
  - "/backup.tar.gz"
  - "/.aws/credentials"
  - "/wp-login.php"
  # secret and configuration files that carry credentials or connection strings directly
  - "/.npmrc"
  - "/.git-credentials"
  - "/.ssh/id_rsa"
  - "/.htpasswd"
  - "/wp-config.php.bak"
  - "/appsettings.json"
  - "/web.config"
  - "/application.properties"
  - "/credentials.json"
  - "/config.yaml"
  # version-control metadata beyond the config, enough to reconstruct the tree
  - "/.git/index"
  - "/.git/logs/HEAD"
  - "/.hg/requires"
  # debug, routing, and management surfaces that leak internals
  - "/actuator/mappings"
  - "/console"
  - "/rails/info/routes"
  # database dumps and archive backups left in the web root
  - "/backup.sql"
  - "/dump.sql"
  - "/database.sql"
  - "/db.sql"
  - "/www.zip"
