# Authorized estate for a full web-surface scan. Any host at or under these
# domain suffixes is in scope, everything else is denied. Replace these with the
# roots you are authorized to assess.
#
# Ceiling is probe: passive discovery, a light HTTP read, and passive endpoint
# enumeration (certificate transparency, OpenAPI specs, archives, JS) are
# allowed. The intrusive endpoint-vuln fuzzing stays gated off at this tier.
# Raise max_tier to intrusive only on a target you are authorized to actively
# test.
domains:
  - example.com
max_tier: probe
