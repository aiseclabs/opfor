# Import-path markers for third-party libraries, the reference the source fingerprint reads to tell
# a project's own code from an inlined dependency. A source file whose path carries one of these is
# a vendored copy, OpenZeppelin, a Uniswap core, solmate, compiled in rather than written by the
# project, so it does not distinguish one codebase from another and is dropped before the own-file
# hashes. It is data, loaded at build time, so adding a library is a data change, not a code change,
# invariant 1.
markers:
  - "@openzeppelin"
  - openzeppelin
  - "@uniswap"
  - "uniswap/"
  - v2-core
  - v2-periphery
  - v3-core
  - v3-periphery
  - v4-core
  - v4-periphery
  - "@chainlink"
  - chainlink
  - solmate
  - solady
  - "@prb"
  - prb-math
  - "@ensdomains"
  - node_modules
  - "/lib/"
  - erc4626
  - layerzero
  - "@layerzerolabs"
