# Deterministic exposure clues, fed to the triage model, never a verdict on their own.
# Triage matches each against an endpoint that answered without auth and, on a match, adds
# a one-line clue to that endpoint in the surface the model judges, for example "clue:
# matched exposed-git, a git config section is present". The clue directs the model's
# attention and survives a truncated body snippet, but whether the exposure is real and how
# severe it is stays the model's call, judged against knowledge/classes. This is the cheap
# first pass, the model covers what the patterns miss.
#
# A clue matches on the path suffix and any of an optional body signature that must be
# present, a regex the body must match, and a content type the response must carry, all
# lowercased. The content type and regex gates exist because a single-page app answers 200
# with its HTML for almost any path, so a bare path match would fire on that HTML. Adding a
# clue is a data change here.

clues:
  - id: exposed-git
    note: a git config section is present, the working tree may be reconstructable
    path: "/.git/config"
    body_contains: "[core]"
  - id: exposed-git-head
    note: a git HEAD ref is present
    path: "/.git/HEAD"
    body_regex: "^ref:\\s"
  - id: exposed-env
    note: environment-style KEY=value lines are present, inspect for secrets
    path: "/.env"
    body_regex: "(?m)^[a-z_][a-z0-9_]{2,}="
  - id: exposed-aws-credentials
    note: an AWS credentials file is present
    path: "/.aws/credentials"
    body_contains: "aws_access_key_id"
  - id: spring-actuator
    note: a Spring Boot Actuator index is present, env and heapdump may follow
    path: "/actuator"
    body_contains: "_links"
    content_type: "json"
  - id: prometheus-metrics
    note: a Prometheus metrics page is present, it leaks internal detail
    path: "/metrics"
    body_contains: "# help"
  - id: apache-server-status
    note: an Apache server-status page is present, it leaks live requests
    path: "/server-status"
    body_contains: "apache server status"
  - id: swagger-openapi
    note: a Swagger specification is present, it maps the API surface
    path: "/swagger.json"
    body_contains: "swagger"
    content_type: "json"
  - id: openapi-spec
    note: an OpenAPI specification is present, it maps the API surface
    path: "/openapi.json"
    body_contains: "openapi"
    content_type: "json"
  - id: directory-listing
    note: a directory listing is enabled, files not meant to be listed are exposed
    path: ""
    body_contains: "index of /"
  - id: phpinfo
    note: a phpinfo page is present, it leaks the full server configuration
    path: "/phpinfo.php"
    body_contains: "phpinfo()"
  - id: ds-store
    note: a .DS_Store file is present, it leaks directory names
    path: "/.DS_Store"
    body_contains: "bud1"
