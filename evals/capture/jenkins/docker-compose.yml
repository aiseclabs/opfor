# Jenkins instances at pinned versions, for capturing fingerprint backtest cassettes.
#
# Run on a machine with Docker, not in CI. Bring the versions up, capture each, tear down:
#
#   docker compose -f evals/capture/jenkins/docker-compose.yml up -d
#   python -m evals.capture.record --product Jenkins --version 2.462.3 --url http://localhost:8462
#   docker compose -f evals/capture/jenkins/docker-compose.yml down
#
# Each capture probes the instance exactly as opfor would and writes evals/corpus/jenkins/<version>.json.
# Jenkins boots slowly, wait for the X-Jenkins response header before capturing.

services:
  jenkins-2-462:
    image: jenkins/jenkins:2.462.3-lts
    ports: ["8462:8080"]
