# Deterministic exposure detectors for unauthenticated interfaces. Triage matches each
# against an endpoint that answered without auth, and mints a finding with a PoC. The PoC
# is a safe read command that demonstrates the exposure, not an exploit, so verification
# stays passive. A detector matches on the path suffix, and any of an optional body
# signature that must be present, a signature that must be absent, a regex the body must
# match, and a content type the response must carry, all lowercased. The content type and
# regex gates exist because a single-page app answers 200 with its HTML for almost any
# path, so a bare path or keyword match would fire on that HTML. Adding a detector is a
# data change here. A match is a strong candidate, the operator confirms.

detectors:
  - id: exposed-git
    title: Exposed Git repository
    severity: HIGH
    path: "/.git/config"
    body_contains: "[core]"
    poc: "curl -s {url} , then reconstruct the working tree from the exposed objects"
  - id: exposed-git-head
    title: Exposed Git metadata
    severity: HIGH
    path: "/.git/HEAD"
    body_regex: "^ref:\\s"
    poc: "curl -s {url}"
  - id: exposed-env
    title: Exposed environment file
    severity: HIGH
    path: "/.env"
    body_regex: "(?m)^[a-z_][a-z0-9_]{2,}="
    poc: "curl -s {url} , inspect for credentials and keys"
  - id: exposed-aws-credentials
    title: Exposed AWS credentials file
    severity: HIGH
    path: "/.aws/credentials"
    body_contains: "aws_access_key_id"
    poc: "curl -s {url}"
  - id: spring-actuator
    title: Exposed Spring Boot Actuator
    severity: HIGH
    path: "/actuator"
    body_contains: "_links"
    content_type: "json"
    poc: "curl -s {url}/env and {url}/heapdump , which can leak config and secrets"
  - id: prometheus-metrics
    title: Exposed Prometheus metrics
    severity: MEDIUM
    path: "/metrics"
    body_contains: "# help"
    poc: "curl -s {url} , which leaks internal service and infrastructure detail"
  - id: apache-server-status
    title: Exposed Apache server-status
    severity: MEDIUM
    path: "/server-status"
    body_contains: "apache server status"
    poc: "curl -s {url} , which leaks live request URLs and client addresses"
  - id: swagger-openapi
    title: Exposed API specification
    severity: MEDIUM
    path: "/swagger.json"
    body_contains: "swagger"
    content_type: "json"
    poc: "curl -s {url} , which maps the unauthenticated API surface"
  - id: openapi-spec
    title: Exposed API specification
    severity: MEDIUM
    path: "/openapi.json"
    body_contains: "openapi"
    content_type: "json"
    poc: "curl -s {url} , which maps the unauthenticated API surface"
  - id: directory-listing
    title: Directory listing enabled
    severity: MEDIUM
    path: ""
    body_contains: "index of /"
    poc: "browse {url} , which exposes files not meant to be listed"
  - id: phpinfo
    title: Exposed phpinfo
    severity: MEDIUM
    path: "/phpinfo.php"
    body_contains: "phpinfo()"
    poc: "curl -s {url} , which leaks the full PHP and server configuration"
  - id: ds-store
    title: Exposed .DS_Store
    severity: LOW
    path: "/.DS_Store"
    body_contains: "bud1"
    poc: "curl -s {url} , which leaks directory names"
