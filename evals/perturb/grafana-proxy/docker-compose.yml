# A perturbation lane: a real vulnerable Grafana behind a proxy that canonicalizes a bare ../
# traversal away but passes an encoded ..%2f through, to verify the reproduce loop adapts against a
# real target rather than only replaying a recipe that fits.
#
#   docker compose -f evals/perturb/grafana-proxy/docker-compose.yml up -d
#   python -m evals.live.run --url http://localhost:3099 --expect-cve CVE-2021-43798
#   docker compose -f evals/perturb/grafana-proxy/docker-compose.yml down
#
# Grafana 8.3.0 carries CVE-2021-43798, a path-traversal file read. The Apache proxy collapses the
# recipe's bare ../ traversal, so the seed request as vendored no longer reproduces, while the
# encoded ..%2f form passes through and still reaches the file. A pass here is the loop reproducing
# only by adapting the seed, its encoding variant, on a real target.
services:
  grafana:
    image: grafana/grafana:8.3.0
  proxy:
    image: httpd:2.4
    depends_on: [grafana]
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    ports: ["3099:80"]
