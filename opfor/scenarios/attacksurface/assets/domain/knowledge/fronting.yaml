# Fronting signatures: what sits in front of a host's origin, so triage reads a finding as
# describing the edge or the origin, and tells the org's own server from a third-party's.
#
# Each category lists the DNS and HTTP evidence that names it. A CNAME to one of these suffixes
# is the strongest signal, a DNS-layer self-declaration. A server token or a marker header is a
# weaker confirmation used when there is no telling CNAME. A host that matches none is left
# unclassified rather than assumed direct, since an unrecognized front is not proof of none.
# Categories are checked in file order, so the first match wins.

cdn:
  cnames:
    - cloudflare.net
    - cloudfront.net
    - fastly.net
    - fastlylb.net
    - edgekey.net
    - edgesuite.net
    - akamaiedge.net
    - akamai.net
    - akamaized.net
    - llnwd.net
    - cachefly.net
    - b-cdn.net
    - azureedge.net
    - azurefd.net
  servers:
    - cloudflare
    - akamaighost
    - varnish
  headers:
    - cf-ray
    - x-amz-cf-id
    - x-fastly-request-id
    - x-akamai-transformed
    - x-cache

cloud:
  cnames:
    - elb.amazonaws.com
    - awsglobalaccelerator.com
    - cloudapp.azure.com
    - trafficmanager.net
    - lb.googleusercontent.com
    - googleusercontent.com
    - run.app
    - appspot.com
  servers:
    - awselb

vendor:
  cnames:
    - github.io
    - herokudns.com
    - herokuapp.com
    - vercel-dns.com
    - vercel.app
    - netlify.app
    - netlify.com
    - pages.dev
    - readthedocs.io
    - statuspage.io
    - zendesk.com
    - myshopify.com
    - wpengine.com
    - ghost.io
    - gitbook.io
    - surge.sh
    - webflow.io
    - fastly-terrarium.com
  servers:
    - vercel
    - netlify
