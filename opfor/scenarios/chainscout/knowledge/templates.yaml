# Standard / audited contract templates to de-prioritize.
#
# A contract whose Etherscan name matches one of `names` (case-insensitive
# substring), or whose proxy implementation is one of `implementations`, is
# treated as well-known, audited, standard code and banded low: not a fresh
# custom target. This is the "skip the multisig / the AMM pair / the OZ
# scaffolding" list.
#
# The planner reads this; no executor does (invariant 1). Add a template with a
# data change here, never in Python. Note: bare OpenZeppelin upgradeable proxies
# (TransparentUpgradeableProxy / ERC1967Proxy) and Diamonds are deliberately NOT
# here, because their risk lives in a custom implementation we treat as custom.

names:
  # Gnosis Safe / Safe multisig wallets (a multisig is not a code target).
  - gnosissafe         # substring, also matches GnosisSafeL2
  - safeproxy
  # PancakeSwap standard AMM / staking (audited forks, everywhere).
  - pancakepair
  - pancakerouter
  - pancakefactory
  - smartchef
  - masterchef
  - syrupbar
  # Common governance / utility scaffolding.
  - timelock
  - multicall
  - multisigwallet

implementations:
  # Canonical Gnosis Safe / Safe singleton implementations on BSC.
  - "0x3e5c63644e683549055b9be8653de26e0b4cd36e"
  - "0x29fcb43b46531bca003ddc8fcb67ffe91900c762"
  - "0xd9db270c1b5e3bd161e8c8503c55ceabee709552"
