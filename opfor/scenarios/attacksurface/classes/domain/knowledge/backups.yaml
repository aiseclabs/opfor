# Backup and editor-artifact name templates, derived against each file a host reveals, so
# the probe follows the real surface rather than a fixed guess list. Deriving the twin is
# code, this is the data it derives from, so a new artifact form is a data change here, not a
# capability change.
#
# append: added after the full filename, config.php becomes config.php.bak.
# rename: replaces the file's own extension, config.php becomes config.zip, catching an
#   archive of the source dropped beside it.
# swap:   an editor dotfile over the filename, {file} expands to the filename, so .{file}.swp
#   becomes .config.php.swp, the vim swap left in the web root.
append:
  - ".bak"
  - "~"
  - ".old"
  - ".orig"
  - ".save"
  - ".swp"
rename:
  - ".bak"
  - ".zip"
  - ".tar.gz"
swap:
  - ".{file}.swp"
  - ".{file}.swo"
