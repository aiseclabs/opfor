[project]
name = "opfor"
version = "0.2.0"
description = "AI-assisted offensive reconnaissance and attack surface mapping."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AISecLabs" }]
keywords = ["security", "offensive security", "reconnaissance", "attack surface", "llm", "red team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
opfor = "opfor.cli:main"

[project.urls]
Homepage = "https://github.com/aiseclabs/opfor"
Repository = "https://github.com/aiseclabs/opfor"
Issues = "https://github.com/aiseclabs/opfor/issues"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opfor*"]

[tool.setuptools.package-data]
"*" = [
    "knowledge/**/*.md",
    "knowledge/**/*.yaml",
]
